# Pricing tiers
# Edit this file to update pricing information

# Currency symbol
currency: "$"
currency_suffix: "/mes"

# Pricing tiers
tiers:
  - id: starter
    name: "Básico"
    description: "Perfecto para empezar"
    price: "XXX.XXX"  # FILL IN: e.g., "150.000"
    features:
      - "1 disciplina"
      - "2 clases por semana"
      - "Acceso a la comunidad"
