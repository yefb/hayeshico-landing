  - id: premium
    name: "Premium"
    description: "Para el practicante dedicado"
    price: "XXX.XXX"  # FILL IN: e.g., "300.000"
    features:
      - "Todas las disciplinas"
      - "Clases ilimitadas"
      - "Acceso a la comunidad"
      - "Eventos especiales"
      - "Sesiones privadas mensuales"
