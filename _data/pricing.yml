  - id: popular
    name: "Popular"
    description: "Nuestra opción más elegida"
    price: "XXX.XXX"  # FILL IN: e.g., "220.000"
    features:
      - "2 disciplinas"
      - "Clases ilimitadas"
      - "Acceso a la comunidad"
      - "Eventos especiales"
