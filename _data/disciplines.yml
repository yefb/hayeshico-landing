- id: taekwondo
  name: "Taekwondo"
  tagline: "El arte del pie y el puño"
  icon: "taekwondo"
  color: "#1976D2"
  short_description: "Arte marcial coreano enfocado en patadas dinámicas y disciplina mental."
  full_description: "El Taekwondo es un arte marcial coreano conocido por sus espectaculares técnicas de patadas y su énfasis en la disciplina mental. Desarrolla flexibilidad, velocidad, coordinación y fortaleza interior."
  benefits:
    - "Mejora la flexibilidad y agilidad"
    - "Desarrolla velocidad y coordinación"
    - "Fortalece la disciplina mental"
    - "Excelente para defensa personal"
