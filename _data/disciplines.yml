    - kids
    - teens
    - adults

- id: judo
  name: "Judo"
  tagline: "El camino de la suavidad"
  icon: "judo"
  color: "#E53935"
  short_description: "Domina el equilibrio y aprende a usar la fuerza de tu oponente."
  full_description: "El Judo es un arte marcial japonés que se centra en técnicas de derribo y control en el suelo. Desarrolla fuerza, flexibilidad y disciplina mental mientras aprendes el camino de la máxima eficacia con mínimo esfuerzo."
  benefits:
    - "Mejora el equilibrio y la coordinación"
    - "Desarrolla fuerza funcional"
    - "Aumenta la confianza y disciplina"
    - "Excelente para defensa personal"
  ages:
    - kids
    - teens
    - adults

- id: jiujitsu
  name: "Jiujitsu"
  tagline: "El arte suave"
  icon: "jiujitsu"
  color: "#7B1FA2"
  short_description: "Técnicas de sumisión y control en el suelo para cualquier tamaño."
  full_description: "El Jiujitsu brasileño se especializa en combate en el suelo, usando llaves y estrangulamientos para someter al oponente. Ideal para personas de cualquier contextura física, ya que la técnica supera a la fuerza bruta."
  benefits:
    - "Técnica sobre fuerza bruta"
    - "Excelente cardio y resistencia"
