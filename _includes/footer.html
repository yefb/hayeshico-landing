<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="{{ site.title }}" class="footer-logo">
        <p>{{ site.description }}</p>
      </div>

      <div class="footer-links">
        <h4>Navegación</h4>
        <nav>
          <a href="#disciplinas">Disciplinas</a>
          <a href="#instructores">Instructores</a>
          <a href="#horarios">Horarios</a>
          <a href="#precios">Precios</a>
          <a href="#contacto">Contacto</a>
        </nav>
      </div>

      <div class="footer-links">
        <h4>Síguenos</h4>
        <nav>
          <a href="https://instagram.com/{{ site.instagram }}" target="_blank" rel="noopener">Instagram</a>
          <a href="https://wa.me/{{ site.whatsapp | remove: '+' }}" target="_blank" rel="noopener">WhatsApp</a>
        </nav>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. Todos los derechos reservados.</p>
    </div>
  </div>
</footer>
